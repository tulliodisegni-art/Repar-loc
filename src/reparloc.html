<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5a3d">
<title>Répar'Loc</title>
<style>
:root{
  --green:#1f5a3d; --green-2:#2e7350; --green-soft:#e6f0ea; --bg:#f6f4ee; --amber:#f2b84b; --amber-soft:#fdf3dd; --card:#fff; --line:#dde3df;
  --text:#1b2620; --muted:#5d6b63; --danger:#b3261e; --danger-soft:#fbe9e7; --warn:#8a5a00; --warn-soft:#fff4d6;
  --info:#24548f; --info-soft:#e5eef9; --violet:#5b3f8f; --violet-soft:#efe9f8; --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;overflow-x:hidden}
html{background:var(--green)}
body{min-height:100vh}
body{background:var(--bg);color:var(--text);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%;overflow-wrap:anywhere}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.top{background:var(--green);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;position:sticky;top:0;z-index:20}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand-t{display:flex;flex-direction:column;min-width:0}.brand svg{width:38px;height:38px;flex:none;border-radius:10px;box-shadow:0 0 0 1.5px rgba(255,255,255,.35)}
.brand b{font-size:19px;letter-spacing:-.01em;white-space:nowrap}
.brand small{font-size:12.5px;opacity:.85;white-space:nowrap}
.who{flex:1 1 auto;min-width:0;max-width:200px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:12px;padding:6px 10px;text-align:left;min-height:44px;cursor:pointer}
.who span{display:block;font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who strong{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{border-radius:12px;padding:9px 12px;margin:12px 0 0;font-size:14px;line-height:1.4}
.banner.demo{background:var(--warn-soft);border:1px solid #f0d58a;color:#5a4100}
.banner.shared{background:var(--info-soft);border:1px solid #b9cfee;color:#1d3f6b}
.banner.urg{background:var(--danger-soft);border:1px solid #f1b8b2;color:#7a1a14}
.banner.err{background:var(--danger-soft);border:1px solid #f1b8b2;color:#7a1a14}
h1{font-size:24px;margin:18px 0 6px;line-height:1.25}
h2{font-size:19px;margin:22px 0 8px}
h3{font-size:17px;margin:0 0 6px}
p{margin:6px 0}
.muted{color:var(--muted)}
.small{font-size:14.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.mine{border-color:var(--green-2);box-shadow:0 0 0 2px var(--green-soft)}
.dcard{display:block;width:100%;text-align:left;cursor:pointer}
.dcard .row1{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dcard .title{font-weight:650;font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid var(--green);background:#fff;color:var(--green);font-weight:600;cursor:pointer;text-align:center;line-height:1.25}
.btn.primary{background:var(--green);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:var(--line);color:var(--text)}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--green-soft);color:var(--green);white-space:normal}
.badge.closed{background:#eceeed;color:#4c5751}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.info{background:var(--info-soft);color:var(--info)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.next{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:15px;background:#f6f8f7;border:1px solid var(--line)}
.next.me{background:var(--green-soft);border-color:#b5d3c1}
.next b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.next.me b{color:var(--green)}
.kv{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:6px 0}
.kv dt{font-size:13.5px;color:var(--muted)}
.kv dd{margin:0 0 6px}
label.lab{display:block;font-weight:600;margin:14px 0 6px}
.hint{font-size:14px;color:var(--muted);margin:-2px 0 6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;border:1px solid #b9c4be;border-radius:10px;padding:10px 12px;background:#fff;max-width:100%}
textarea{min-height:100px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #9cc7ae;border-color:var(--green)}
.err{color:var(--danger);font-size:14.5px;font-weight:600;margin-top:4px}
.err:empty{display:none}
.choice{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;cursor:pointer;background:#fff}
.choice input{margin-top:4px;width:20px;height:20px;flex:none;accent-color:var(--green)}
.chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.chips .choice{margin:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:15px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--green);color:#fff;border-color:var(--green)}
.nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:616px;margin:0 auto;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(31,90,61,.12);border-radius:24px;box-shadow:0 10px 30px rgba(20,48,31,.18),0 2px 6px rgba(20,48,31,.08);z-index:30;overflow:hidden}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:0;padding:8px 2px 9px;min-height:58px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer;position:relative}
.nav button span{white-space:nowrap;font-size:11.5px}
.nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current=page]{color:var(--green);font-weight:700}
.nav .dot{position:absolute;top:5px;right:calc(50% - 20px);background:var(--danger);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 4px}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h2{margin-top:0}
.sheet-actions{display:flex;flex-direction:column-reverse;gap:8px;margin-top:18px}
@media(min-width:520px){.sheet-actions{flex-direction:row;justify-content:flex-end}.overlay{align-items:center}.sheet{border-radius:18px}}
#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));background:#14301f;color:#fff;padding:12px 16px;border-radius:12px;max-width:min(92vw,560px);z-index:60;font-size:15.5px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
#toast.show{display:block}
#toast.bad{background:var(--danger)}
.msg{border-radius:12px;padding:10px 12px;margin:8px 0;background:#f6f8f7;border:1px solid var(--line)}
.msg.me{background:var(--green-soft);border-color:#c3dccd}
.msg .meta{font-size:13px;color:var(--muted);margin-bottom:2px}
.hist{list-style:none;padding:0;margin:0}
.hist li{border-left:3px solid #b5d3c1;padding:2px 0 8px 10px;font-size:15px}
.hist time{display:block;font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:22px 12px;color:var(--muted);background:#fff;border:1px dashed #c4cdc8;border-radius:var(--r);margin:10px 0}
.photo{border-radius:12px;border:1px solid var(--line);max-width:100%;display:block}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0}
.mgrid .mi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#e9eee9;border:1px solid var(--line)}
.mgrid .mi img,.mgrid .mi video{width:100%;height:100%;object-fit:cover;display:block}
.mgrid .mi .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:28px;padding:0;cursor:pointer}
.mgrid .mi .tag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:1px 5px}
.mview video{width:100%;border-radius:12px;background:#000;display:block;margin:8px 0}
.mview img{width:100%;border-radius:12px;display:block;margin:8px 0}
.pickbtn{display:flex;align-items:center;justify-content:center;gap:8px;border:2px dashed #b9c4be;border-radius:12px;padding:14px;cursor:pointer;background:#fff;font-weight:600;color:var(--green)}
.pickbtn input{position:absolute;width:1px;height:1px;opacity:0}
#g-where-slot .lab{margin-top:0}
figure{margin:8px 0}
figcaption{font-size:13.5px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{background:none;border:0;color:var(--green);font-weight:600;padding:12px 0 4px;min-height:44px;cursor:pointer}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.08em;font-weight:700;background:var(--green-soft);padding:6px 10px;border-radius:8px;display:inline-block}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
details summary{cursor:pointer;font-weight:600;min-height:28px}
ol.steps{padding-left:22px}
ol.steps li{margin:6px 0}
.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.sec h3{color:var(--green)}
.hero{background:linear-gradient(135deg,#1f5a3d,#2e7350);color:#fff;border-radius:18px;padding:18px 16px;margin:14px 0 8px;display:flex;gap:14px;align-items:center}
.hero h1{margin:0 0 4px;color:#fff}.hero p{margin:0;opacity:.92}
.hero svg{width:62px;height:62px;flex:none;border-radius:16px;box-shadow:0 0 0 2px rgba(255,255,255,.3)}
.welcome{text-align:center;padding-top:18px}
.welcome svg.big{width:112px;height:112px;border-radius:28px;box-shadow:0 10px 30px rgba(31,90,61,.25)}
.welcome h1{font-size:28px;margin:14px 0 4px}
.tag{font-size:18px;color:var(--green);font-weight:600}
.rolecard{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.rolecard .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:24px}
.ic.t{background:var(--info-soft)}.ic.o{background:var(--amber-soft)}.ic.p{background:var(--violet-soft)}
.status-line{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* =========================================================
   Répar'Loc — prototype. Deux espaces :
   - Démo : données fictives, 3 rôles simulés, stockage local.
   - Vrai compte : version installée, comptes et base Supabase, rôles reliés par code.
   ========================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const DAY = 86400000, HOUR = 3600000;

const CATS = {plomberie:'Plomberie', electricite:'Électricité', chauffage:'Chauffage', menuiserie:'Menuiserie', equipement:'Équipement', autre:'Autre'};
const CAT_ICON = {plomberie:'💧', electricite:'⚡', chauffage:'🔥', menuiserie:'🚪', equipement:'🍳', autre:'🏠'};
/* Problèmes courants proposés au locataire. danger : message de sécurité affiché avant l'envoi. */
const PROBS = {
  plomberie:[{t:"Fuite d'eau sous un évier ou un lavabo"}, {t:"Chasse d'eau qui coule en continu"}, {t:'WC bouchés'}, {t:"Évier, douche ou baignoire qui s'écoule mal"}, {t:'Robinet qui fuit ou goutte'}, {t:"Tache d'humidité, dégât des eaux"}, {t:"Grosse fuite : l'eau coule sans s'arrêter", danger:"Coupez l'arrivée d'eau générale (souvent sous l'évier ou près du compteur) et prévenez vos voisins du dessous. Si l'eau touche des prises ou des appareils électriques, coupez aussi le disjoncteur."}],
  electricite:[{t:'Prise qui ne fonctionne plus'}, {t:'Lumière ou interrupteur en panne'}, {t:'Le disjoncteur saute'}, {t:"Plus de courant dans une pièce"}, {t:'Sonnette ou interphone en panne'}, {t:'Prise ou fil qui chauffe, étincelles, odeur de brûlé', danger:"Coupez le disjoncteur général et ne touchez à rien. En cas de fumée ou de début d'incendie, appelez les pompiers (18 ou 112)."}],
  chauffage:[{t:'Radiateur qui reste froid'}, {t:'Plus de chauffage du tout'}, {t:'Chaudière en panne ou en sécurité'}, {t:"Pas d'eau chaude (ballon, chauffe-eau)"}, {t:'Radiateur qui fuit'}, {t:'Thermostat qui ne répond plus'}, {t:'Odeur de gaz', danger:"N'allumez rien, n'utilisez aucun interrupteur, ouvrez les fenêtres, sortez du logement et appelez Urgence Sécurité Gaz au 0 800 47 33 33 (gratuit, 24 h/24) ou le 112."}],
  menuiserie:[{t:'Volet roulant bloqué'}, {t:'Porte qui ferme mal'}, {t:'Fenêtre qui ne ferme plus'}, {t:'Serrure ou poignée cassée'}, {t:'Vitre fêlée ou cassée'}, {t:'Placard, tiroir ou parquet abîmé'}],
  equipement:[{t:'Plaque de cuisson en panne'}, {t:'Four en panne'}, {t:'Hotte ou VMC qui ne fonctionne plus'}, {t:'Lave-linge fourni en panne'}, {t:'Réfrigérateur fourni en panne'}, {t:'Moisissures, mauvaise aération'}],
  autre:[{t:'Nuisibles (cafards, punaises, souris…)'}, {t:'Infiltration par le toit ou un mur'}, {t:'Fissure dans un mur ou un plafond'}, {t:'Problème dans les parties communes'}]
};
const ROOMS = ['Cuisine', 'Salle de bain', 'WC', 'Salon', 'Chambre', 'Entrée / couloir', 'Extérieur', 'Tout le logement'];
const SINCE = ["Aujourd'hui", 'Depuis quelques jours', "Depuis plus d'une semaine"];
const IMPACT = ['Gênant mais je peux attendre', "Je ne peux plus utiliser l'équipement ou la pièce", 'Dégâts en cours (eau, humidité…)'];
const DISPO = ['En semaine le matin', "En semaine l'après-midi", 'En semaine après 17 h', 'Le samedi'];
const TRADE_RX = {plomberie:/plomb|sanitaire|chauffag/i, electricite:/[ée]lec/i, chauffage:/chauff|chaudi|plomb|clim|gaz/i, menuiserie:/menuis|serrur|vitr|volet|[ée]b[ée]nist|store/i, equipement:/[ée]lectrom[ée]nag|[ée]lec|ventil|vmc/i, autre:/ma[çc]on|peint|b[âa]timent|d[ée]sinsect|nuisible/i};
const TRADES = ['Plombier', 'Plombier-chauffagiste', 'Chauffagiste', 'Électricien', 'Menuisier', 'Serrurier', 'Vitrier', 'Peintre', 'Maçon', 'Carreleur', 'Couvreur', 'Réparateur électroménager', 'Désinsectisation', 'Artisan multiservice'];
const CAT_TRADE = {plomberie:'Plombier', electricite:'Électricien', chauffage:'Chauffagiste', menuiserie:'Menuisier', equipement:'Réparateur électroménager', autre:'Artisan multiservice'};
const proFits = (p, cat) => (TRADE_RX[cat] && TRADE_RX[cat].test(p.trade || '')) || /multi|tous travaux|homme toutes mains|r[ée]novation/i.test(p.trade || '');
const SLOTS = ['8h – 10h','10h – 12h','12h – 14h','14h – 16h','16h – 18h'];
const ST = {
  NOUVEAU:'Nouveau signalement', PRECISIONS:'Précisions demandées', A_CHOISIR:'Professionnel à choisir',
  ATTENTE_PRO:'En attente du professionnel', PROPOSITION:'Proposition à valider', RDV_A_ORGANISER:'Rendez-vous à organiser',
  RDV_PROPOSE:'Rendez-vous proposé', RDV_CONFIRME:'Rendez-vous confirmé', TERMINEE:'Intervention terminée',
  SUIVI:'Suivi complémentaire', CLOTURE:'Clôturé', CLASSE:'Classé sans intervention'
};
const CLOSED = ['CLOTURE','CLASSE'];
const ROLE_WORD = {owner:'propriétaire', tenant:'locataire', pro:'professionnel'};
const ROLE_TITLE = {owner:'Propriétaire', tenant:'Locataire', pro:'Professionnel'};
const URGENCE = "Hors urgences : cette application n'est pas surveillée en permanence. En cas de danger, contactez les services appropriés.";
const DEMO_TXT = "Démonstration : données fictives uniquement. Les dossiers ne sont pas partagés entre téléphones. Aucun message réel n'est envoyé.";

/* ---------- Préférences locales ---------- */
const PREF_KEY = 'reparloc-prefs-v1', DEMO_KEY = 'reparloc-demo-v1';
let storageOk = true;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ storageOk = false; return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); return true; } catch(e){ storageOk = false; return false; } }
let PREFS = {mode:'demo', role:'owner', guideSeen:false};
try { const p = JSON.parse(lsGet(PREF_KEY) || 'null'); if (p && typeof p === 'object') PREFS = Object.assign(PREFS, p); } catch(e){}
function savePrefs(){ lsSet(PREF_KEY, JSON.stringify(PREFS)); }

/* ---------- Dates ---------- */
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoDate(new Date());
const fmtDT = ts => new Date(ts).toLocaleString('fr-FR', {day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'}).replace(',', ' à');
const fmtDay = iso => new Date(iso + 'T12:00:00').toLocaleDateString('fr-FR', {weekday:'long', day:'numeric', month:'long', year:'numeric'});
const fmtEUR = n => new Intl.NumberFormat('fr-FR', {style:'currency', currency:'EUR'}).format(n);

/* ---------- Logo ---------- */

function resetShared(){ Object.assign(SH, {admin:false, adm:null, uid:null, email:'', me:null, members:{}, logements:[], pros:[], dossiers:[], notifs:[], msgIds:new Set()}); }
async function q(p){ const r = await p; if (r.error) throw r.error; return r.data; }
function sbErr(e){
  const m = String((e && (e.message || e.error_description)) || e || '');
  if (/Failed to fetch|NetworkError|network/i.test(m)) return 'Pas de connexion internet. Réessayez dans un instant.';
  if (/row-level security|violates|permission denied/i.test(m)) return "Cette action n'est pas autorisée pour votre compte.";
  if (/seul_le_proprietaire/.test(m)) return 'Seul le propriétaire peut choisir le professionnel.';
  if (/Invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/Email not confirmed/i.test(m)) return "Confirmez d'abord votre adresse avec le lien reçu par e-mail.";
  if (/already registered|already been registered/i.test(m)) return 'Un compte existe déjà avec cet e-mail : connectez-vous.';
  if (/rate limit|too many/i.test(m)) return 'Trop de tentatives. Patientez quelques minutes.';
  if (/Password should be/i.test(m)) return 'Mot de passe trop faible : 8 caractères minimum.';
  return 'Une erreur est survenue (' + m.slice(0, 120) + ').';
}

}

/* Un dossier est rangé en trois parts : commune, locataire ↔ propriétaire (lp), propriétaire ↔ professionnel (pp).
   Le serveur ne donne à chacun que les parts qu'il a le droit de voir. */
function splitScopes(d){
  const main = clone(d); ['messages','id','logementId','proId','quote','quoteHistory','declined'].forEach(k => delete main[k]);
  main.qa = []; main.history = (d.history || []).filter(h => !h.vis);
  main.past = (d.past || []).map(p => { const c = Object.assign({}, p); delete c.quote; delete c.quoteHistory; return c; });
  const lp = {qa:(d.qa || []).filter(x => x.askedBy !== 'pro'), history:(d.history || []).filter(h => h.vis === 'lp')};
  const pp = {qa:(d.qa || []).filter(x => x.askedBy === 'pro'), history:(d.history || []).filter(h => h.vis === 'pp'), quote:d.quote || null, quoteHistory:d.quoteHistory || [], declined:d.declined || [], pastQuotes:(d.past || []).map(p => p.quote || null)};
  return {main, lp, pp};
}
function mergeScopes(main, lp, pp){
  const d = clone(main || {}); lp = lp || {}; pp = pp || {};
  d.qa = [...(lp.qa || []), ...(pp.qa || [])].sort((a, b) => a.at - b.at);
  d.history = [...(d.history || []), ...(lp.history || []), ...(pp.history || [])].sort((a, b) => a.at - b.at);
  d.quote = pp.quote || null; d.quoteHistory = pp.quoteHistory || []; d.declined = pp.declined || [];
  d.past = (d.past || []).map((p, i) => Object.assign({}, p, {quote:(pp.pastQuotes || [])[i] || null}));
  if (!d.apptHistory) d.apptHistory = [];
  return d;
}
async function reloadShared(){
  const sb = SH.sb;
  const prof = await q(sb.from('rl_profiles').select('*'));
  const mine = prof.find(p => p.user_id === SH.uid);
  if (!mine){ SH.me = null; SH.status = 'profile'; render(); return; }
  const [logs, pros, dos, lps, pps, msgs, notifs] = await Promise.all([
    q(sb.from('rl_logements').select('*')), q(sb.from('rl_pros').select('*')), q(sb.from('rl_dossiers').select('*')),
    mine.role !== 'pro' ? q(sb.from('rl_dossier_lp').select('*')) : Promise.resolve([]),
    mine.role !== 'tenant' ? q(sb.from('rl_dossier_pp').select('*')) : Promise.resolve([]),
    q(sb.from('rl_messages').select('*').order('created_at').limit(3000)),
    q(sb.from('rl_notifs').select('*').order('created_at', {ascending:false}).limit(200))]);
  SH.logements = logs.map(l => ({id:l.id, name:l.name, city:l.city, ownerId:l.owner_id, tenantId:l.tenant_id, inviteCode:l.invite_code}));
  SH.pros = pros.map(p => ({id:p.id, name:p.name, trade:p.trade, ownerId:p.owner_id, uid:p.user_id, inviteCode:p.invite_code}));
  const members = {}; prof.forEach(p => members[p.user_id] = {id:p.user_id, role:p.role, name:p.name});
  SH.pros.forEach(p => { if (p.uid && members[p.uid]) members[p.uid].proId = p.id; });
  SH.members = members; SH.me = members[SH.uid];
  const lpm = new Map(lps.map(r => [r.dossier_id, r.data])), ppm = new Map(pps.map(r => [r.dossier_id, r.data]));
  SH.msgIds = new Set(msgs.map(m => m.id));
  SH.dossiers = dos.map(r => {
    const d = mergeScopes(r.data, lpm.get(r.id), ppm.get(r.id));
    d.id = r.id; d.logementId = r.logement_id; d.proId = r.pro_id;
    d.messages = msgs.filter(m => m.dossier_id === r.id).map(m => ({id:m.id, ch:m.ch, by:m.author, text:m.text, at:Date.parse(m.created_at)}));
    return d;
  });
  SH.notifs = notifs.map(n => ({id:n.id, to:n.to_user, dossierId:n.dossier_id, text:n.text, at:Date.parse(n.created_at), read:n.read}));
  SH.status = (SH.me.role !== 'owner' && !linked()) || SH.wantCode ? 'link' : 'ready';
  render();
}
function linked(){ const m = SH.me; if (!m) return false; if (m.role === 'tenant') return SH.logements.some(l => l.tenantId === m.id); if (m.role === 'pro') return SH.pros.some(p => p.uid === m.id); return true; }
async function saveShared(d, notifs){
  const sb = SH.sb, role = me().role, {main, lp, pp} = splitScopes(d);
  const exists = SH.dossiers.some(x => x.id === d.id);
  const newMsgs = (d.messages || []).filter(m => !SH.msgIds.has(m.id)).map(m => ({dossier_id:d.id, ch:m.ch, text:m.text}));
  const writeMain = () => exists ? q(sb.from('rl_dossiers').update({pro_id:d.proId || null, data:main}).eq('id', d.id).select('id'))
                                 : q(sb.from('rl_dossiers').insert({id:d.id, logement_id:d.logementId, data:main}).select('id'));
  const sendNotifs = async () => { if (notifs.length) await sb.from('rl_notifs').insert(notifs.map(n => ({to_user:n.to, dossier_id:d.id, text:n.text.slice(0, 300)}))); };
  if (role === 'pro'){
    // le professionnel écrit sa part avant la part commune : s'il décline, il perd ensuite l'accès
    await q(sb.from('rl_dossier_pp').upsert({dossier_id:d.id, data:pp}));
    if (newMsgs.length) await q(sb.from('rl_messages').insert(newMsgs));
    await sendNotifs();
    if (!d.proId){ await q(sb.rpc('rl_pro_release', {p_id:d.id, p_data:main})); }
    else { const r = await writeMain(); if (!r || !r.length) throw new Error('row-level security'); }
  } else {
    const r = await writeMain(); if (!r || !r.length) throw new Error('row-level security');
    await q(sb.from('rl_dossier_lp').upsert({dossier_id:d.id, data:lp}));
    if (role === 'owner' && (d.proId || pp.quote || pp.declined.length || pp.qa.length || pp.history.length)) await q(sb.from('rl_dossier_pp').upsert({dossier_id:d.id, data:pp}));
    if (newMsgs.length) await q(sb.from('rl_messages').insert(newMsgs));
    await sendNotifs();
  }
  await reloadShared();
}

const isShared = () => PREFS.mode === 'shared';
const DATA = () => isShared() ? SH : DEMO;
function me(){ return isShared() ? SH.me : DEMO.people[PREFS.role] || DEMO.people.owner; }
function person(id){ return isShared() ? SH.members[id] : DEMO.people[id]; }
function logement(id){ return DATA().logements.find(l => l.id === id); }
function pro(id){ return DATA().pros.find(p => p.id === id); }
function proName(id){ const p = pro(id); return p ? p.name : 'Professionnel retiré'; }
function personLabel(id){
  const p = person(id); if (!p) return 'Personne inconnue';
  if (p.role === 'pro'){ const pr = pro(p.proId); return `${pr ? pr.name : p.name} (professionnel)`; }
  return `${p.name} (${ROLE_WORD[p.role]})`;
}
function myProId(){ const m = me(); return m && m.role === 'pro' ? m.proId : null; }
function canSee(d){
  const m = me(); if (!m) return false;
  const L = logement(d.logementId);
  if (m.role === 'owner') return !!L && L.ownerId === m.id;
  if (m.role === 'tenant') return !!L && L.tenantId === m.id;
  if (m.role === 'pro') return !!d.proId && d.proId === m.proId;
  return false;
}
function viewOf(d){
  if (isShared()) return d;
  const sc = splitScopes(d);
  const v = mergeScopes(sc.main, canSeeCh('lp') ? sc.lp : null, canSeeCh('pp') ? sc.pp : null);
  v.id = d.id; v.logementId = d.logementId; v.proId = d.proId; v.messages = (d.messages || []).filter(x => canSeeCh(msgCh(x)));
  return v;
}
const visible = () => DATA().dossiers.filter(canSee).map(viewOf);
function myLogements(){
  const m = me(); if (!m) return [];
  if (m.role === 'owner') return DATA().logements.filter(l => l.ownerId === m.id);
  if (m.role === 'tenant') return DATA().logements.filter(l => l.tenantId === m.id);
  return [];
}
function ownerPros(ownerId){ return DATA().pros.filter(p => p.ownerId === ownerId); }
function getD(id){ const d = DATA().dossiers.find(x => x.id === id); return d ? clone(d) : null; }

/* ---------- Prochaine action ---------- */
function pendingQA(d){ return (d.qa || []).slice().reverse().find(q => !q.answer); }
/* Conversations séparées : lp = locataire ↔ propriétaire, pp = propriétaire ↔ professionnel. */
function canSeeCh(ch){ const m = me(); if (!m || !ch) return !!m; if (m.role === 'owner') return true; if (m.role === 'tenant') return ch === 'lp'; if (m.role === 'pro') return ch === 'pp'; return false; }
function msgCh(x){ if (x.ch) return x.ch; const p = person(x.by); return p && p.role === 'pro' ? 'pp' : 'lp'; }
function nextAction(d){
  const q = d.quote, a = d.appointment;
  switch (d.status){
    case 'NOUVEAU': return {actor:'owner', text:'Examiner la demande : demander une précision, transmettre à un professionnel ou classer sans intervention.'};
    case 'PRECISIONS': { const p = pendingQA(d); return p && p.askedBy === 'pro' ? {actor:'owner', text:'Répondre à la question du professionnel.'} : {actor:'tenant', text:'Répondre à la question du propriétaire.'}; }
    case 'A_CHOISIR': {
      if (q && q.status === 'refusée') return {actor:'owner', text:'Choisir un professionnel (la proposition précédente a été refusée), ou classer le dossier.'};
      if ((d.declined || []).length) return {actor:'owner', text:'Choisir un autre professionnel (le précédent a décliné), ou classer le dossier.'};
      return {actor:'owner', text:'Choisir un professionnel.'};
    }
    case 'ATTENTE_PRO':
      if (!d.accepted) return {actor:'pro', text:'Accepter ou décliner la demande.'};
      if (q && q.status === 'modification demandée') return {actor:'pro', text:'Envoyer une proposition modifiée.'};
      return {actor:'pro', text:"Envoyer une proposition d'intervention (description et montant)."};
    case 'PROPOSITION': return {actor:'owner', text:q ? `Valider la proposition (version ${q.version}) : accepter, refuser ou demander une modification.` : 'Valider la proposition du professionnel.'};
    case 'RDV_A_ORGANISER':
      if (a && a.status === 'refusé') return {actor:'pro', text:'Proposer un autre créneau (le locataire a demandé une autre date).'};
      if (a && a.status === 'à reprogrammer') return {actor:'pro', text:'Proposer une nouvelle date (rendez-vous à reprogrammer).'};
      return {actor:'pro', text:'Proposer une date et un créneau de rendez-vous.'};
    case 'RDV_PROPOSE': return {actor:'tenant', text:'Confirmer le rendez-vous ou demander une autre date.'};
    case 'RDV_CONFIRME': return {actor:'pro', text:"Intervenir, puis indiquer que l'intervention est terminée."};
    case 'TERMINEE':
      if (!d.feedback) return {actor:'tenant', text:'Indiquer si le problème semble résolu.'};
      return {actor:'owner', text:'Clôturer le suivi ou demander une suite.'};
    case 'SUIVI': return {actor:'owner', text:'Transmettre la suite à un professionnel, ou classer le dossier.'};
    case 'CLOTURE': return {actor:null, text:'Aucune action : le suivi est clôturé.'};
    case 'CLASSE': return {actor:null, text:'Aucune action : dossier classé sans intervention.'};
  }
  return {actor:null, text:''};
}
function actorName(d, actor){
  const m = me();
  if (m && actor === m.role) return 'Vous';
  const L = logement(d.logementId);
  if (actor === 'owner') return L ? personLabel(L.ownerId) : 'Propriétaire';
  if (actor === 'tenant') return L && L.tenantId ? personLabel(L.tenantId) : 'Locataire (pas encore inscrit)';
  if (actor === 'pro') return d.proId ? proName(d.proId) + ' (professionnel)' : 'Professionnel';
  return '';
}
function myTurn(d){ const m = me(); return !!m && canSee(d) && nextAction(d).actor === m.role; }
function statusBadge(d){ const cls = d.status === 'CLASSE' || d.status === 'CLOTURE' ? 'closed' : ''; return `<span class="badge ${cls}">${esc(ST[d.status] || d.status)}</span>`; }

/* ---------- Enregistrement ---------- */
function targetIds(d, roles){
  const L = logement(d.logementId), ids = new Set();
  roles.forEach(r => {
    if (r === 'owner' && L) ids.add(L.ownerId);
    if (r === 'tenant' && L && L.tenantId) ids.add(L.tenantId);
    if (r === 'pro' && d.proId){ const p = pro(d.proId); if (p && p.uid) ids.add(p.uid); }
  });
  const m = me(); if (m) ids.delete(m.id);
  return [...ids];
}
async function commit(d, histText, roles, notifText, opts = {}){
  const now = Date.now(); d.updatedAt = now;
  if (histText) d.history.push(Object.assign({at:now, by:me().id, text:histText}, opts.vis ? {vis:opts.vis} : {}));
  if (d.history.length > 200) d.history = d.history.slice(-200);
  const targets = opts.targets || targetIds(d, roles || []);
  const notifs = targets.map(to => ({id:newId(), to, dossierId:d.id, text:`${d.title} — ${notifText || histText}`, at:now, read:false}));
  if (isShared()){
    try { await saveShared(d, notifs); }
    catch(e){ reloadShared().catch(() => {}); return {errors:{_: sbErr(e)}}; }
  } else {
    const i = DEMO.dossiers.findIndex(x => x.id === d.id);
    if (i >= 0) DEMO.dossiers[i] = d; else DEMO.dossiers.push(d);
    DEMO.notifs.push(...notifs);
    if (DEMO.notifs.length > 300) DEMO.notifs = DEMO.notifs.slice(-300);
    saveDemo();
  }
  render();
  return null;
}

/* ---------- Interface : état ---------- */
const ui = {view:'home', id:null, f:{logement:'all', etat:'open', mine:false}};
const memPhotos = {}; // ancien aperçu photo (démo)
let pendingPhoto = null;
/* Photos et vidéos. Vrai compte : stockées dans Supabase (rangement privé « rl-media », un dossier par signalement,
   lisibles seulement par les participants). Démo : aperçu sur ce téléphone, perdu au rechargement. */
const MEDIA_MAX = 10, VIDEO_MAX_MB = 50;
const memMedia = {};      // démo : id dossier -> [{url, k}]
let pendingMedia = [];    // fichiers choisis dans le formulaire en cours : [{file, url, k}]
const signed = {};        // chemin -> {url, exp}
const mediaKind = f => /^video\//.test(f.type) ? 'vid' : 'img';
function addPending(files, box){
  let err = '';
  for (const f of files){
    if (!/^(image|video)\//.test(f.type)){ err = 'Seules les photos et les vidéos sont acceptées.'; continue; }
    if (pendingMedia.length >= MEDIA_MAX){ err = `${MEDIA_MAX} fichiers maximum.`; break; }
    if (mediaKind(f) === 'vid' && f.size > VIDEO_MAX_MB * 1048576){ err = `Vidéo trop lourde (${Math.round(f.size / 1048576)} Mo, ${VIDEO_MAX_MB} Mo maximum) : filmez 20 à 30 secondes suffisent.`; continue; }
    pendingMedia.push({file:f, url:URL.createObjectURL(f), k:mediaKind(f)});
  }
  drawPending(box, err);
}
function drawPending(box, err){
  if (!box) return;
  box.innerHTML = pendingHtml(err);
}
function pendingHtml(err){
  return (pendingMedia.length ? `<div class="mgrid">${pendingMedia.map((m, i) => `<div class="mi">${m.k === 'vid' ? `<video src="${m.url}#t=0.1" muted playsinline preload="metadata"></video><span class="tag">▶ vidéo</span>` : `<img src="${m.url}" alt="Photo ${i + 1}">`}<button type="button" class="x" data-act="media-rm" data-i="${i}" aria-label="Retirer">×</button></div>`).join('')}</div>` : '') + (err ? `<div class="err">${esc(err)}</div>` : '');
}
function clearPending(){ pendingMedia.forEach(m => { try { URL.revokeObjectURL(m.url); } catch(e){} }); pendingMedia = []; }
async function shrinkImage(file){
  // réduit les photos (1600 px, JPEG) pour un envoi rapide ; garde l'original en cas d'échec
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
    return blob && blob.size < file.size ? blob : file;
  } catch(e){ return file; }
}
async function uploadPending(d){
  // renvoie la liste des médias enregistrés ; en démo, garde un aperçu local
  const out = [], list = pendingMedia; pendingMedia = [];
  if (!list.length) return out;
  if (!isShared()){ memMedia[d.id] = (memMedia[d.id] || []).concat(list.map(m => ({url:m.url, k:m.k}))); return list.map(m => ({k:m.k, local:true, at:Date.now(), by:me().id})); }
  let failed = 0;
  for (const m of list){
    try {
      const body = m.k === 'img' ? await shrinkImage(m.file) : m.file;
      const ext = m.k === 'img' ? 'jpg' : ((m.file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4');
      const path = `${d.id}/${newId()}.${ext}`;
      const r = await SH.sb.storage.from('rl-media').upload(path, body, {contentType:m.k === 'img' && body !== m.file ? 'image/jpeg' : (m.file.type || 'application/octet-stream'), upsert:false});
      if (r.error) throw r.error;
      out.push({p:path, k:m.k, at:Date.now(), by:me().id});
    } catch(e){ failed++; }
    try { URL.revokeObjectURL(m.url); } catch(e){}
  }
  if (failed) toast(`${failed} fichier${failed > 1 ? 's n’ont' : ' n’a'} pas pu être envoyé${failed > 1 ? 's' : ''}. Vérifiez la connexion et réessayez depuis le dossier.`, true);
  return out;
}
async function attachMedia(d, ctxText){
  const n = pendingMedia.length; if (!n) return;
  const added = await uploadPending(d);
  if (!added.length) return;
  const fresh = getD(d.id) || d;
  fresh.media = (fresh.media || []).concat(added.filter(m => !m.local));
  if (!isShared()) fresh.mediaDemo = (fresh.mediaDemo || 0) + added.length;
  const nb = added.length, lbl = `${nb} photo${nb > 1 ? 's' : ''} ou vidéo${nb > 1 ? 's' : ''}`;
  const roles = ['owner','tenant','pro'].filter(r => r !== me().role && (r !== 'pro' || fresh.proId));
  await commit(fresh, ctxText || `${lbl} ajoutée${nb > 1 ? 's' : ''}`, roles, `${lbl} ajoutée${nb > 1 ? 's' : ''} au dossier`);
}
async function signMedia(paths){
  const need = paths.filter(p => !signed[p] || signed[p].exp < Date.now() + 60000);
  if (!need.length || !isShared()) return;
  try {
    const r = await SH.sb.storage.from('rl-media').createSignedUrls(need, 3600);
    (r.data || []).forEach(x => { if (x.signedUrl) signed[x.path] = {url:x.signedUrl, exp:Date.now() + 3500000}; });
  } catch(e){}
  if (ui.view === 'dossier') render();
}
function mediaSection(d){
  const items = (d.media || []).filter(m => m.p);
  const local = memMedia[d.id] || [];
  const closed = CLOSED.includes(d.status);
  if (!items.length && !local.length && closed) return '';
  if (items.length) { const miss = items.map(m => m.p).filter(p => !signed[p]); if (miss.length) setTimeout(() => signMedia(miss), 0); }
  const one = (k, url, alt) => !url ? `<div class="muted small">Chargement…</div>` : k === 'vid' ? `<video src="${url}" controls playsinline preload="metadata"></video>` : `<a href="${url}" target="_blank" rel="noopener"><img src="${url}" alt="${esc(alt)}" loading="lazy"></a>`;
  let inner = items.map((m, i) => one(m.k, signed[m.p] && signed[m.p].url, `Photo ${i + 1}`)).join('') + local.map((m, i) => one(m.k, m.url, `Photo ${i + 1}`)).join('');
  if (!inner) inner = `<p class="muted small">Aucune photo ni vidéo pour l'instant.</p>`;
  if (local.length) inner += `<p class="muted small">Démonstration : aperçu sur ce téléphone seulement, perdu au rechargement.</p>`;
  else if (!isShared() && d.mediaDemo) inner += `<p class="muted small">Démonstration : des photos avaient été ajoutées, mais elles ne sont pas conservées après rechargement.</p>`;
  if (!closed) inner += `<label class="pickbtn" style="position:relative;margin-top:8px">📷 Ajouter des photos ou une vidéo<input type="file" accept="image/*,video/*" multiple data-media-add="${esc(d.id)}"></label><div id="media-add-box"></div>`;
  return `<div class="sec mview"><h3>Photos et vidéos (${items.length + local.length})</h3>${inner}</div>`;
}

function go(view, id){ if (view !== 'signaler' && ui.view === 'signaler') clearPending(); ui.view = view; ui.id = id || null; render(); window.scrollTo(0, 0); }
let toastT = null;
function toast(msg, bad){ const t = $('#toast'); t.textContent = msg; t.className = 'show' + (bad ? ' bad' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = '', 4200); }

/* ---------- Fenêtre (formulaires, confirmations) ---------- */
let modalHandler = null, lastFocus = null;
function openModal(title, body, submitLabel, handler, opts = {}){
  modalHandler = handler; lastFocus = document.activeElement;
  $('#modal-root').innerHTML = `<div class="overlay" data-act="modal-bg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mt">
    <h2 id="mt">${esc(title)}</h2><form id="modal-form" novalidate>${body}<div class="err" data-err="_"></div>
    <div class="sheet-actions"><button type="button" class="btn ghost" data-act="modal-close">${esc(opts.cancel || 'Annuler')}</button>
    ${submitLabel ? `<button type="submit" class="btn ${opts.danger ? 'danger' : 'primary'}">${esc(submitLabel)}</button>` : ''}</div></form></div></div>`;
  document.body.classList.add('noscroll');
  const f = $('#modal-form input:not([type=hidden]):not([type=radio]):not([type=checkbox]), #modal-form textarea, #modal-form select');
  setTimeout(() => { if (f) f.focus(); else { const b = $('#modal-form button[type=submit]'); if (b) b.focus(); } }, 30);

function closeModal(){ $('#modal-root').innerHTML = ''; modalHandler = null; document.body.classList.remove('noscroll'); if (lastFocus && lastFocus.focus) try{ lastFocus.focus(); }catch(e){} }
function confirmBox(title, text, label, fn, danger){ openModal(title, `<p>${text}</p>`, label, fn, {danger}); }

/* ---------- Champs de formulaire ---------- */
const fArea = (name, label, o = {}) => `<label class="lab" for="f-${name}">${esc(label)}${o.req ? '' : ' <span class="muted small">(facultatif)</span>'}</label>${o.hint ? `<div class="hint">${esc(o.hint)}</div>` : ''}<textarea id="f-${name}" name="${name}" maxlength="${o.max || 1500}">${esc(o.value || '')}</textarea><div class="err" data-err="${name}"></div>`;
const fText = (name, label, o = {}) => `<label class="lab" for="f-${name}">${esc(label)}${o.req ? '' : ' <span class="muted small">(facultatif)</span>'}</label>${o.hint ? `<div class="hint">${esc(o.hint)}</div>` : ''}<input type="${o.type || 'text'}" id="f-${name}" name="${name}" value="${esc(o.value || '')}" ${o.attrs || ''} maxlength="${o.max || 120}"><div class="err" data-err="${name}"></div>`;
const tooShort = (v, n) => !v || v.trim().length < n;

/* ---------- Actions métier ---------- */
function archiveCycle(d){
  if (d.quote || d.appointment || d.report || d.feedback){
    d.past.push({proId:d.proId, quote:d.quote, quoteHistory:d.quoteHistory, appointment:d.appointment, report:d.report, feedback:d.feedback, followUp:d.followUp, at:Date.now()});
  }
  d.quote = null; d.quoteHistory = []; d.appointment = null; d.apptHistory = []; d.report = null; d.feedback = null;
}
function afterQuote(d){ const a = d.appointment; if (a && a.status === 'confirmé') return 'RDV_CONFIRME'; if (a && a.status === 'proposé') return 'RDV_PROPOSE'; return 'RDV_A_ORGANISER'; }
function quoteForm(d, revise){
  const q = d.quote || {};
  return `${revise ? `<div class="banner demo">Vous modifiez une proposition déjà acceptée. La nouvelle version devra être acceptée à nouveau par le propriétaire.</div>` : ''}
  ${q.status === 'modification demandée' ? `<div class="banner demo"><b>Demande du propriétaire :</b> ${esc(q.ownerComment)}</div>` : ''}
  ${fArea('desc', "Description de l'intervention", {req:true, value:q.description, hint:'Ce que vous prévoyez de faire.'})}
  ${fText('amount', 'Montant indicatif TTC (en euros)', {req:true, type:'text', value:q.amount ? String(q.amount).replace('.', ',') : '', attrs:'inputmode="decimal" placeholder="Ex. : 150"'})}
  <label class="choice"><input type="checkbox" name="visit" ${q.needsVisit ? 'checked' : ''}><span>Une visite préalable serait nécessaire<br><span class="muted small">Information seulement : le parcours « visite préalable » sera ajouté plus tard.</span></span></label>
  <p class="muted small">Ceci est une proposition dans l'application, ni un devis signé ni une signature électronique.</p>`;
}
async function submitQuote(f, d, revise){
  const errors = {};
  if (tooShort(f.desc, 10)) errors.desc = 'Décrivez l’intervention en quelques mots (10 caractères minimum).';
  const amount = parseFloat(String(f.amount || '').replace(/\s/g, '').replace(',', '.'));
  if (!(amount > 0) || amount > 100000) errors.amount = 'Indiquez un montant valide, par exemple 150.';
  if (Object.keys(errors).length) return {errors};
  if (d.quote) d.quoteHistory.push(d.quote);
  const v = (d.quote ? d.quote.version : 0) + 1;
  d.quote = {version:v, description:f.desc.trim(), amount:Math.round(amount*100)/100, needsVisit:!!f.visit, status:'proposée', at:Date.now(), replacesAccepted:!!revise};
  d.status = 'PROPOSITION';
  return commit(d, revise ? `Nouvelle version v${v} de la proposition (${fmtEUR(d.quote.amount)}) : un nouvel accord est nécessaire` : `Proposition v${v} envoyée : ${fmtEUR(d.quote.amount)}`, ['owner','tenant'], `Proposition à valider (v${v})`, {vis:'pp'});
}
function apptForm(d){
  const tom = new Date(Date.now() + DAY);
  const a = d.appointment;
  return `${d.availability ? `<div class="banner shared"><b>Disponibilités du locataire :</b> ${esc(d.availability)}</div>` : ''}
  ${a && a.tenantComment ? `<div class="banner demo"><b>Message du locataire :</b> ${esc(a.tenantComment)}</div>` : ''}
  ${fText('date', 'Date proposée', {req:true, type:'date', attrs:`min="${isoDate(tom)}"`})}
  <label class="lab" for="f-slot">Créneau</label><select id="f-slot" name="slot"><option value="">Choisir un créneau</option>${SLOTS.map(s => `<option>${s}</option>`).join('')}</select><div class="err" data-err="slot"></div>
  <p class="muted small">Le locataire devra confirmer ce rendez-vous.</p>`;
}
async function submitAppt(f, d){
  const errors = {};
  if (!f.date || !/^\d{4}-\d{2}-\d{2}$/.test(f.date)) errors.date = 'Choisissez une date.';
  else if (f.date <= todayISO()) errors.date = 'La date doit être à partir de demain.';
  if (!f.slot) errors.slot = 'Choisissez un créneau.';
  if (Object.keys(errors).length) return {errors};
  const prev = d.appointment;
  if (prev) d.apptHistory.push(prev);
  d.appointment = {version:(prev ? prev.version : 0) + 1, date:f.date, slot:f.slot, status:'proposé', at:Date.now()};
  d.status = 'RDV_PROPOSE';
  const txt = prev ? `Nouveau rendez-vous proposé : ${fmtDay(f.date)}, ${f.slot} (à confirmer à nouveau)` : `Rendez-vous proposé : ${fmtDay(f.date)}, ${f.slot}`;
  return commit(d, txt, ['tenant','owner'], 'Rendez-vous proposé : à confirmer');
}

  close:{role:'owner', label:'Clôturer le suivi', primary:true, when:d => d.status === 'TERMINEE',

  classify:{role:'owner', label:'Classer sans intervention', when:d => ['NOUVEAU','A_CHOISIR','PRECISIONS','SUIVI'].includes(d.status),

  /* --- Locataire --- */

  ownerAnswer:{role:'owner', label:'Répondre au professionnel', primary:true, when:d => d.status === 'PRECISIONS' && pendingQA(d) && pendingQA(d).askedBy === 'pro',

  rdvConfirm:{role:'tenant', label:'Confirmer le rendez-vous', primary:true, when:d => d.status === 'RDV_PROPOSE' && d.appointment,

      d.appointment.status = 'confirmé'; d.appointment.confirmedAt = Date.now(); d.status = 'RDV_CONFIRME';

  rdvOther:{role:'tenant', label:'Demander une autre date', when:d => d.status === 'RDV_PROPOSE' && d.appointment,
    open:d => openModal('Demander une autre date', fArea('c', 'Vos disponibilités', {req:true, hint:'Ex. : pas disponible ce jour-là, plutôt mardi ou jeudi après 17 h.'}), 'Envoyer', f => {

      d.appointment.status = 'refusé'; d.appointment.tenantComment = f.c.trim(); d.status = 'RDV_A_ORGANISER';

  rdvReschedule:{role:'tenant', label:'Demander à reprogrammer', when:d => d.status === 'RDV_CONFIRME' && d.appointment,
    open:d => openModal('Reprogrammer le rendez-vous', fArea('c', 'Pourquoi et quand êtes-vous disponible ?', {req:true}), 'Demander', f => {
      if (tooShort(f.c, 5)) return {errors:{c:'Indiquez vos disponibilités.'}};
      d.appointment.status = 'à reprogrammer'; d.appointment.tenantComment = f.c.trim(); d.status = 'RDV_A_ORGANISER';
      return commit(d, `Le locataire demande à reprogrammer : « ${f.c.trim()} »`, ['pro','owner'], 'Rendez-vous à reprogrammer');
    })},
  feedback:{role:'tenant', label:'Donner mon retour après l’intervention', primary:true, when:d => d.status === 'TERMINEE' && !d.feedback,
    open:d => openModal('Le problème semble-t-il résolu ?', `<p class="muted small">Votre retour décrit la situation ; ce n'est pas une validation technique des travaux.</p>
      <label class="choice"><input type="radio" name="res" value="oui"><span>Oui, le problème semble résolu</span></label>

      ${fArea('c', 'Commentaire', {hint:'Obligatoire si le problème persiste.'})}`, 'Envoyer mon retour', f => {
      if (!f.res) return {errors:{res:'Choisissez une réponse.'}};
      if (f.res === 'non' && tooShort(f.c, 5)) return {errors:{c:'Décrivez ce qui ne va pas encore.'}};
      d.feedback = {resolved:f.res === 'oui', comment:(f.c || '').trim(), at:Date.now()};
      return commit(d, `Retour du locataire : ${d.feedback.resolved ? 'le problème semble résolu' : 'le problème persiste'}${d.feedback.comment ? ` (« ${d.feedback.comment} »)` : ''}`, ['owner','pro'], d.feedback.resolved ? 'Le locataire indique que le problème semble résolu' : 'Le locataire indique que le problème persiste');
    })},
  availability:{role:'tenant', label:'Indiquer mes disponibilités', when:d => !CLOSED.includes(d.status),
    open:d => openModal('Mes disponibilités', fArea('c', 'Quand êtes-vous disponible ?', {req:true, value:d.availability, hint:'Ex. : en semaine après 17 h, le samedi matin.'}), 'Enregistrer', f => {
      if (tooShort(f.c, 3)) return {errors:{c:'Indiquez vos disponibilités.'}};
      d.availability = f.c.trim();
      return commit(d, `Disponibilités mises à jour : « ${d.availability} »`, d.accepted ? ['owner','pro'] : ['owner'], 'Disponibilités du locataire mises à jour');
    })},
  /* --- Professionnel --- */
  proAccept:{role:'pro', label:'Accepter la demande', primary:true, when:d => d.status === 'ATTENTE_PRO' && !d.accepted,
    open:d => confirmBox('Accepter la demande ?', 'Vous pourrez ensuite envoyer une proposition d’intervention au propriétaire.', 'J’accepte', () => {
      d.accepted = true; return commit(d, 'Demande acceptée par le professionnel', ['owner','tenant'], 'Le professionnel a accepté la demande');
    })},
  proDecline:{role:'pro', label:'Décliner la demande', when:d => d.status === 'ATTENTE_PRO' && !d.accepted,
    open:d => openModal('Décliner la demande', `<p class="muted small">Le propriétaire pourra choisir un autre professionnel. Vous n'aurez plus accès à ce dossier.</p>${fArea('r', 'Motif', {req:true, hint:'Ex. : pas disponible avant 3 semaines.'})}`, 'Décliner', async f => {
      if (tooShort(f.r, 5)) return {errors:{r:'Indiquez un motif.'}};
      const targets = targetIds(d, ['owner']);
      const name = proName(d.proId);
      d.declined.push({proId:d.proId, reason:f.r.trim(), at:Date.now()}); d.proId = null; d.accepted = false; d.status = 'A_CHOISIR';
      const res = await commit(d, `${name} a décliné : « ${f.r.trim()} »`, null, 'Le professionnel a décliné', {targets, vis:'pp'});
      if (!res){ ui.view = 'dossiers'; ui.id = null; render(); }
      return res;
    }, {danger:true})},
  proAsk:{role:'pro', label:'Demander une information au propriétaire', when:d => d.status === 'ATTENTE_PRO',
    open:d => openModal('Demander une information', `<p class="muted small">Votre question est envoyée au propriétaire, qui vous répondra (en interrogeant le locataire si besoin).</p>${fArea('q', 'Votre question', {req:true, hint:'Ex. : quelle est la marque du volet ?'})}`, 'Envoyer la question', f => {
      if (tooShort(f.q, 5)) return {errors:{q:'Écrivez votre question.'}};
      d.qa.push({askedBy:'pro', by:me().id, question:f.q.trim(), answer:null, at:Date.now(), returnStatus:'ATTENTE_PRO'});
      d.status = 'PRECISIONS';
      return commit(d, `Information demandée par le professionnel : « ${f.q.trim()} »`, ['owner'], 'Le professionnel vous pose une question', {vis:'pp'});
    })},
  quoteSend:{role:'pro', label:'Envoyer une proposition d’intervention', primary:true, when:d => d.status === 'ATTENTE_PRO' && d.accepted,
    open:d => openModal(d.quote && d.quote.status === 'modification demandée' ? 'Proposition modifiée' : 'Proposition d’intervention', quoteForm(d, false), 'Envoyer au propriétaire', f => submitQuote(f, d, false))},
  rdvPropose:{role:'pro', label:'Proposer un rendez-vous', primary:true, when:d => d.status === 'RDV_A_ORGANISER',
    open:d => openModal('Proposer un rendez-vous', apptForm(d), 'Proposer ce rendez-vous', f => submitAppt(f, d))},
  rdvChange:{role:'pro', label:'Modifier la date proposée', when:d => d.status === 'RDV_PROPOSE',
    open:d => openModal('Modifier la date proposée', apptForm(d), 'Proposer cette date', f => submitAppt(f, d))},
  rdvMove:{role:'pro', label:'Reprogrammer le rendez-vous', when:d => d.status === 'RDV_CONFIRME',
    open:d => openModal('Reprogrammer le rendez-vous', `<div class="banner demo">Le nouveau rendez-vous devra être confirmé à nouveau par le locataire.</div>${apptForm(d)}`, 'Proposer la nouvelle date', f => submitAppt(f, d))},
  done:{role:'pro', label:'Indiquer que l’intervention est terminée', primary:true, when:d => d.status === 'RDV_CONFIRME',
    open:d => openModal('Intervention terminée', `${fArea('r', 'Compte rendu', {req:true, hint:'Ce qui a été fait, pièces changées, conseils.'})}
      <p class="lab">Un passage supplémentaire est-il nécessaire ?</p>
      <label class="choice"><input type="radio" name="extra" value="non"><span>Non</span></label>
      <label class="choice"><input type="radio" name="extra" value="oui"><span>Oui, un autre passage est nécessaire</span></label><div class="err" data-err="extra"></div>
      <p class="muted small">Le dossier ne sera pas clôturé automatiquement : le locataire donne son retour, puis le propriétaire décide.</p>`, 'Enregistrer', f => {
      const errors = {};
      if (tooShort(f.r, 10)) errors.r = 'Le compte rendu est obligatoire (10 caractères minimum).';
      if (!f.extra) errors.extra = 'Répondez à cette question.';
      if (Object.keys(errors).length) return {errors};
      d.report = {text:f.r.trim(), extraVisit:f.extra === 'oui', at:Date.now()}; d.feedback = null; d.status = 'TERMINEE';
      return commit(d, `Intervention indiquée comme terminée${d.report.extraVisit ? ' (passage supplémentaire nécessaire)' : ''}, compte rendu ajouté`, ['tenant','owner'], 'Intervention terminée : votre retour est attendu');
    })},
  quoteRevise:{role:'pro', label:'Modifier ma proposition (nouvel accord)', when:d => ['RDV_A_ORGANISER','RDV_PROPOSE','RDV_CONFIRME'].includes(d.status) && d.quote && d.quote.status === 'acceptée',
    open:d => openModal('Modifier la proposition acceptée', quoteForm(d, true), 'Envoyer la nouvelle version', f => submitQuote(f, d, true))}
};
function actionsFor(d){ const m = me(); if (!m || !canSee(d)) return []; return Object.entries(ACTIONS).filter(([k, a]) => a.role === m.role && a.when(d)).map(([k, a]) => Object.assign({key:k}, a)); }

/* ---------- Rendu ---------- */
const ICONS = {
  home:'<path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/>',
  list:'<path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/>',
  cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  house:'<path d="M4 21V9l8-5 8 5v12"/><path d="M9 21v-6h6v6"/>',
  plus:'<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  bell:'<path d="M6 16V11a6 6 0 1112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>'
};
const ico = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`;
function unread(){ const m = me(); if (!m) return 0; return DATA().notifs.filter(n => n.to === m.id && !n.read).length; }

function render(){
  const app = $('#app');
  const m = me();
  let main = '';
  if (!PREFS.welcomed && ui.view === 'home') main = viewWelcome();
  else if (isShared() && (SH.status !== 'ready' || !SH.me) && !(ui.view === 'admin' && SH.admin)) main = viewSharedGate();
  else {
    const V = {home:viewHome, dossiers:viewList, dossier:viewDetail, rdv:viewRdv, logements:viewLogements, signaler:viewReport, notifs:viewNotifs, menu:viewMenu, guide:viewGuide, admin:viewAdmin}[ui.view] || viewHome;
    main = V();
  }
  const sharedReady = !isShared() || (SH.status === 'ready' && SH.me);
  const welcoming = !PREFS.welcomed && ui.view === 'home';
  app.innerHTML = `${header()}<main class="wrap">${welcoming ? '' : banners()}${main}</main>${welcoming ? '' : (sharedReady ? nav() : navMin())}`;
}
function header(){
  const m = me();
  let who = '';
  if (!isShared()) who = `<button class="who" data-act="role" aria-label="Changer de rôle de démonstration"><span>Vous testez · changer ▾</span><strong>${esc(m.role === 'pro' ? proName(m.proId) : m.name)}</strong><span>${ROLE_TITLE[m.role]}</span></button>`;
  else if (SH.me) who = `<button class="who" data-act="go" data-view="menu"><span>Mon compte</span><strong>${esc(SH.me.name)}</strong><span>${ROLE_TITLE[SH.me.role]}</span></button>`;
  return `<header class="top"><div class="top-in"><div class="brand">${logo()}<div class="brand-t"><b>Répar'Loc</b><small>${isShared() ? 'Mon espace' : 'Démonstration'}</small></div></div>${who}</div></header>`;
}
function banners(){
  let s = isShared()
    ? `<div class="banner shared">Version de test : chacun ne voit que ses propres dossiers. Aucun e-mail ni SMS n'est envoyé. Évitez les informations sensibles.</div>`
    : `<div class="banner demo">${esc(DEMO_TXT)}</div>`;
  if (!isShared() && !storageOk) s += `<div class="banner err">La sauvegarde locale n'est pas disponible dans ce navigateur : vos changements seront perdus au rechargement.</div>`;
  return s;
}
function nav(){
  const m = me(); const n = unread();
  const items = [['home','home','Accueil'], ['dossiers','list','Dossiers'], ['rdv','cal','Agenda']];
  if (m.role === 'owner') items.push(['logements','house','Logements']);
  else if (m.role === 'tenant') items.push(['signaler','plus','Signaler']);
  else items.push(['notifs','bell','Alertes']);
  items.push(['menu','menu','Menu']);
  const cur = ui.view === 'dossier' ? 'dossiers' : (['guide','admin'].includes(ui.view) ? 'menu' : ui.view);
  return `<nav class="nav" aria-label="Navigation principale"><div class="nav-in">${items.map(([v, i, l]) => `<button data-act="go" data-view="${v}" ${cur === v ? 'aria-current="page"' : ''}>${ico(i)}<span>${l}</span>${v === 'home' && n ? `<span class="dot">${n}</span>` : ''}${v === 'notifs' && n ? `<span class="dot">${n}</span>` : ''}</button>`).join('')}</div></nav>`;
}
function navMin(){ return `<nav class="nav"><div class="nav-in" style="grid-template-columns:1fr 1fr"><button data-act="mode" data-mode="demo">${ico('home')}<span>Revenir à la démo</span></button><button data-act="go" data-view="guide">${ico('menu')}<span>Guide</span></button></div></nav>`; }

function dossierCard(d){
  const L = logement(d.logementId), na = nextAction(d), mine = myTurn(d);
  return `<button class="card dcard ${mine ? 'mine' : ''}" data-act="open" data-id="${esc(d.id)}">
    <div class="row1"><span class="title">${esc(d.title)}</span></div>
    <div class="status-line">${statusBadge(d)}${d.urgent && !CLOSED.includes(d.status) ? '<span class="badge warn">⚠️ Urgent</span>' : ''}${mine ? '<span class="badge warn">À vous d’agir</span>' : ''}</div>
    <div class="muted small">${esc(L ? `${L.name} · ${L.city}` : 'Logement retiré')} · ${esc(CATS[d.category] || '')} · ${esc(d.num)}</div>
    ${na.actor ? `<div class="next ${mine ? 'me' : ''}"><b>Action attendue de : ${esc(actorName(d, na.actor))}</b>${esc(na.text)}</div>` : ''}
    <div class="muted small" style="margin-top:6px">Mis à jour le ${esc(fmtDT(d.updatedAt))}</div></button>`;
}
function upcomingAppts(list){
  const t = todayISO();
  return list.filter(d => d.appointment && ['proposé','confirmé'].includes(d.appointment.status) && ['RDV_PROPOSE','RDV_CONFIRME','PROPOSITION'].includes(d.status) && d.appointment.date >= t)
    .sort((a, b) => (a.appointment.date + a.appointment.slot).localeCompare(b.appointment.date + b.appointment.slot));
}
function apptLine(d){
  const a = d.appointment, L = logement(d.logementId);
  const st = a.status === 'confirmé' ? '<span class="badge">Confirmé</span>' : a.status === 'proposé' ? '<span class="badge warn">À confirmer par le locataire</span>' : `<span class="badge closed">${esc(a.status)}</span>`;
  return `<button class="card dcard" data-act="open" data-id="${esc(d.id)}"><div class="title" style="text-transform:capitalize">${esc(fmtDay(a.date))}</div><div>${esc(a.slot)} · ${esc(d.title)}</div><div class="muted small">${esc(L ? L.name + ' · ' + L.city : '')} · ${esc(d.proId ? proName(d.proId) : '')}</div><div class="status-line">${st}${d.status === 'PROPOSITION' ? '<span class="badge info">Proposition modifiée en attente d’accord</span>' : ''}</div></button>`;
}

function viewWelcome(){
  const r = ui.wRole;
  const card = (k, ic, cls, title, txt) => `<button class="rolecard" style="width:100%;cursor:pointer;${r === k ? 'border-color:#1f5a3d;box-shadow:0 0 0 2px #cfe5d8' : ''}" data-act="w-role" data-role="${k}"><div class="ic ${cls}">${ic}</div><div><b>${title}</b><br><span class="muted">${txt}</span></div></button>`;
  let s = `<div class="welcome">${logo('big')}<h1>Bienvenue sur Répar'Loc</h1><p class="tag">Signaler, autoriser, organiser et suivre une réparation au même endroit.</p></div>
  <h2 style="text-align:center">Pour commencer, vous êtes…</h2>
  ${card('tenant', '🏠', 't', 'Locataire', 'Je signale un problème et je suis ma demande.')}
  ${card('owner', '🔑', 'o', 'Propriétaire', 'Je reçois les demandes et je choisis mon professionnel.')}
  ${card('pro', '🛠️', 'p', 'Professionnel', "Je reçois des demandes claires et j'organise l'intervention.")}`;
  if (r){
    s += `<div class="btns">${RL ? `<button class="btn primary block" data-act="w-real">Créer mon compte ou me connecter</button><button class="btn block" data-act="w-demo">Essayer d'abord la démonstration</button>`
      : `<button class="btn primary block" data-act="w-demo">Découvrir la démonstration</button>`}<button class="btn ghost block" data-act="welcome-guide">Lire le guide</button></div>`;
    if (!RL) s += `<p class="muted small" style="text-align:center">Les vrais comptes sont dans l'appli installée : <a href="${esc(APP_LINK)}">${esc(APP_LINK)}</a></p>`;
  } else s += `<p class="muted small" style="text-align:center;margin-top:10px">Touchez votre rôle pour continuer.</p>`;
  if (RL) s += `<div class="btns"><button class="btn ghost block" data-act="w-login">J'ai déjà un compte : me connecter</button></div>`;
  s += `<p class="muted small" style="text-align:center;margin-top:12px">Répar'Loc coordonne les échanges : il ne diagnostique pas les pannes, n'encaisse aucun paiement et n'est pas un service d'urgence.</p>`;
  return s;
}
function viewHome(){
  const m = me(), list = visible(), open = list.filter(d => !CLOSED.includes(d.status));
  const mine = open.filter(myTurn).sort((a, b) => b.updatedAt - a.updatedAt);
  const appts = upcomingAppts(open).slice(0, 3);
  const n = unread();
  const first = m.role === 'pro' ? proName(m.proId) : m.name.split(' ')[0];
  const hour = new Date().getHours();
  const hello = hour >= 18 || hour < 5 ? 'Bonsoir' : 'Bonjour';
  const sub = m.role === 'owner' ? (mine.length ? `${mine.length} dossier${mine.length > 1 ? 's attendent' : ' attend'} votre décision.` : 'Tout est à jour dans vos logements.')
    : m.role === 'tenant' ? (open.length ? 'Voici où en sont vos demandes.' : 'Un souci dans le logement ? On s’en occupe ensemble.')
    : (mine.length ? `${mine.length} demande${mine.length > 1 ? 's' : ''} à traiter.` : 'Aucune demande en attente pour vous.');
  let s = `<div class="hero">${logo()}<div><h1>${hello} ${esc(first)}</h1><p>${esc(sub)}</p></div></div>`;

  s += mine.length ? mine.map(dossierCard).join('') : `<div class="empty">Rien à faire pour l'instant. ${m.role === 'tenant' ? 'Vous pouvez signaler un nouveau problème.' : 'Vous serez prévenu ici dès qu’une action vous attend.'}</div>`;

  return s;
}

  // Proposition
  if (d.quote){

    let inner = `<div class="status-line"><span class="badge closed">Version ${q.version}</span>${qs}</div><p>${esc(q.description)}</p><p><b>Montant indicatif : ${esc(fmtEUR(q.amount))}</b> <span class="muted small">(${isShared() ? 'saisi par le professionnel' : 'fictif'})</span></p>${q.needsVisit ? '<p class="badge info">Le professionnel indique qu’une visite préalable serait nécessaire</p>' : ''}${q.replacesAccepted ? '<p class="small"><b>Cette version remplace une proposition déjà acceptée : un nouvel accord est nécessaire.</b></p>' : ''}${q.ownerComment && canSeeCh('pp') ? `<p class="small">Commentaire du propriétaire : « ${esc(q.ownerComment)} »</p>` : ''}<p class="muted small">Proposition dans l’application : ni devis signé ni signature électronique. Le propriétaire règle directement le professionnel.</p>`;

  if (d.report) s += section('Compte rendu du professionnel', `<p>${esc(d.report.text)}</p><p class="small">Passage supplémentaire nécessaire : <b>${d.report.extraVisit ? 'oui' : 'non'}</b></p><p class="muted small">Indiqué le ${esc(fmtDT(d.report.at))}</p>`);
  if (d.report) s += section('Retour du locataire', d.feedback ? `<p><b>${d.feedback.resolved ? 'Le problème semble résolu.' : 'Le problème persiste.'}</b></p>${d.feedback.comment ? `<p>« ${esc(d.feedback.comment)} »</p>` : ''}<p class="muted small">Retour sur la situation, pas une validation technique des travaux.</p>` : `<p class="muted">En attente du retour du locataire.</p>`);
  if (d.followUp && d.status === 'SUIVI') s += section('Suite demandée', `<p>${esc(d.followUp.comment)}</p>`);

  // Échanges : deux conversations séparées
  const convo = (ch, title, who) => {

    return section(title, `<p class="muted small">${ch === 'lp' ? 'Visible uniquement par le locataire et le propriétaire.' : 'Visible uniquement par le propriétaire et le professionnel.'} ${isShared() ? 'Aucune notification par e-mail ou SMS.' : 'Enregistré sur ce téléphone uniquement.'}</p>${html}`);
  };
  if (m.role === 'owner'){
    s += convo('lp', 'Conversation avec le locataire', 'au locataire');

  return s;
}

  }).join('') || '<p class="muted">Aucun dossier.</p>');

}

    const res = await run(async () => {
      if (ui.authMode === 'signup'){
        const r = await SH.sb.auth.signUp({email, password:f.password, options:{emailRedirectTo:APP_LINK}});
        if (r.error) return {errors:{_:sbErr(r.error)}};
        if (!r.data.session){ SH.info = 'Compte créé. Ouvrez le lien de confirmation reçu par e-mail, puis connectez-vous ici.'; ui.authMode = 'login'; render(); return null; }
        await afterLogin(r.data.session.user); return null;
      }
      const r = await SH.sb.auth.signInWithPassword({email, password:f.password});
      if (r.error) return {errors:{_:sbErr(r.error)}};
      SH.info = ''; await afterLogin(r.data.user); return null;
    });
    if (res && res.errors) showErrors(form, res.errors);
    return;
  }
  if (form.dataset.form === 'profile'){
    const errors = {};
    if (tooShort(f.name, 2)) errors.name = 'Indiquez votre nom.';
    if (!['owner','tenant','pro'].includes(f.role)) errors.role = 'Choisissez votre rôle.';
    if (Object.keys(errors).length){ showErrors(form, errors); return; }
    const res = await run(async () => { try { await q(SH.sb.from('rl_profiles').insert({name:f.name.trim(), role:f.role})); await reloadShared(); } catch(e){ return {errors:{_:sbErr(e)}}; } return null; });
    if (res && res.errors) showErrors(form, res.errors); else { ui.view = f.role === 'owner' ? 'logements' : 'home'; render(); }
    return;
  }
  if (form.dataset.form === 'join'){
    const code = String(f.code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 8){ showErrors(form, {code:'Le code contient 8 caractères, par exemple ABCD-EFGH.'}); return; }
    const res = await run(async () => {
      const r = await SH.sb.rpc('rl_redeem', {p_code:code});
      if (r.error){
        const m = r.error.message || '';
        if (/code_inconnu/.test(m)) return {errors:{code:'Code inconnu. Vérifiez les 8 caractères.'}};
        if (/code_utilise/.test(m)) return {errors:{code:'Ce code a déjà été utilisé. Demandez-en un nouveau.'}};
        const mr = m.match(/mauvais_role:(\w+)/);
        if (mr) return {errors:{code:`Ce code est destiné à un ${ROLE_WORD[mr[1]] || mr[1]}, alors que votre compte est ${ROLE_WORD[SH.me.role]}.`}};
        return {errors:{_:sbErr(r.error)}};
      }
      SH.wantCode = false; await reloadShared(); return null;
    });
    if (res && res.errors) showErrors(form, res.errors); else { toast('C’est fait : vous êtes relié à votre ' + (SH.me.role === 'tenant' ? 'logement.' : 'propriétaire.')); go('home'); }
    return;
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && $('#modal-root').innerHTML) closeModal(); });

/* ---------- Démarrage ---------- */
loadDemo();
if (!DEMO.people[PREFS.role]) PREFS.role = 'owner';
if (PREFS.mode === 'shared') initShared();
render();
</script>
</body>
</html>
